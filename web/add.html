<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Assignment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(135deg, #eef6ff, #f4fbfa);

            color: #1f2d3d;
        }


        /* Decorative Background Circle - Top Left */

        body::before {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: rgba(74, 144, 226, 0.06);

            top: -150px;
            left: -150px;

            z-index: -1;
        }


        /* Decorative Background Circle - Bottom Right */

        body::after {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(80, 190, 170, 0.06);

            bottom: -200px;
            right: -180px;

            z-index: -1;
        }


        /* Page Heading */

        .page-title {
            text-align: center;

            margin-top: 55px;
            margin-bottom: 48px;

            font-size: 38px;

            font-weight: 500;

            letter-spacing: 6px;

            color: #1d2d44;
        }


        /* Form Card */

        .form-container {
            width: 760px;

            max-width: 90%;

            margin: 0 auto 50px auto;

            padding: 45px 45px 48px 45px;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #d4e3f5;

            border-radius: 12px;

            box-shadow:
                0 12px 35px rgba(31, 60, 90, 0.12),
                0 2px 8px rgba(31, 60, 90, 0.06);
        }


        /* Labels */

        label {
            display: block;

            margin-bottom: 9px;

            font-size: 17px;

            font-weight: 600;

            color: #1f2d3d;
        }


        /* Input and Select Fields */

        input,
        select {
            width: 100%;

            height: 58px;

            padding: 0 18px;

            margin-bottom: 27px;

            border: 1px solid #d4dce6;

            border-radius: 7px;

            background: #ffffff;

            color: #34495e;

            font-size: 16px;

            outline: none;

            transition: all 0.2s ease;
        }


        /* Input Focus */

        input:focus,
        select:focus {
            border-color: #3978d8;

            box-shadow:
                0 0 0 3px rgba(57, 120, 216, 0.10);
        }


        /* Placeholder */

        input::placeholder {
            color: #718096;
        }


        /* Date and Time */

        input[type="date"],
        input[type="time"] {
            color: #34495e;
        }


        /* Add Assignment Button */

        .add-button {
            width: 100%;

            height: 64px;

            margin-top: 3px;

            border: none;

            border-radius: 7px;

            background: #3978d8;

            color: white;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;

            cursor: pointer;

            transition: all 0.2s ease;
        }


        /* Add Button Hover */

        .add-button:hover {
            background: #2f69c2;

            transform: translateY(-1px);

            box-shadow:
                0 5px 14px rgba(57, 120, 216, 0.20);
        }


        /* Add Button Click */

        .add-button:active {
            transform: translateY(0);
        }


        /* Back to Dashboard */

        .back-button {
            display: block;

            width: 100%;

            height: 62px;

            margin-top: 18px;

            border: 2px solid #3978d8;

            border-radius: 7px;

            background: white;

            color: #3978d8;

            text-decoration: none;

            text-align: center;

            line-height: 58px;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;

            transition: all 0.2s ease;
        }


        /* Back Button Hover */

        .back-button:hover {
            background: #3978d8;

            color: white;
        }


        /* Responsive Design */

        @media (max-width: 700px) {

            .page-title {
                margin-top: 35px;

                margin-bottom: 30px;

                font-size: 28px;

                letter-spacing: 4px;
            }


            .form-container {
                padding: 30px 25px 35px 25px;
            }


            input,
            select {
                height: 54px;
            }


            .add-button {
                height: 58px;

                font-size: 16px;
            }


            .back-button {
                height: 58px;

                line-height: 54px;

                font-size: 16px;
            }
        }

    </style>
</head>


<body>


    <!-- Page Heading -->

    <div class="page-title">
        ADD NEW ASSIGNMENT
    </div>


    <!-- Assignment Form -->

    <div class="form-container">

        <!-- HelloServlet handles the form submission -->

        <form action="HelloServlet" method="post">


            <!-- Assignment Name -->

            <label for="assignmentName">
                Assignment Name:
            </label>

            <input
                type="text"
                id="assignmentName"
                name="assignmentName"
                placeholder="Enter assignment name"
                required
            >


            <!-- Subject -->

            <label for="subject">
                Subject:
            </label>

            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Enter subject"
                required
            >


            <!-- Deadline Date -->

            <label for="deadline">
                Deadline Date:
            </label>

            <input
                type="date"
                id="deadline"
                name="deadline"
                required
            >


            <!-- Deadline Time -->

            <label for="deadlineTime">
                Deadline Time:
            </label>

            <input
                type="time"
                id="deadlineTime"
                name="deadlineTime"
                required
            >


            <!-- Priority -->

            <label for="priority">
                Priority:
            </label>

            <select
                id="priority"
                name="priority"
                required
            >

                <option value="High">
                    High
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Low">
                    Low
                </option>

            </select>


            <!-- Add Assignment -->

            <button
                type="submit"
                class="add-button">

                ADD ASSIGNMENT

            </button>

        </form>


        <!-- Back to Dashboard -->

        <a
            href="Dashboard"
            class="back-button">

            BACK TO DASHBOARD

        </a>

    </div>


</body>

</html>
