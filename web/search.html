<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Search Assignments</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef6ff, #f4fbfa);
            color: #1f2d3d;
        }

        body::before {
            content: '';
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(74, 144, 226, 0.06);
            top: -150px;
            left: -150px;
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(80, 190, 170, 0.06);
            bottom: -200px;
            right: -180px;
            z-index: -1;
        }

        .container {
            width: 760px;
            max-width: 90%;
            margin: 62px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #d4e3f5;
            border-radius: 14px;
            padding: 48px 55px 50px 55px;

            box-shadow:
                0 12px 35px rgba(31, 60, 90, 0.12),
                0 2px 8px rgba(31, 60, 90, 0.06);
        }

        .card h1 {
            margin: 0 0 38px 0;
            text-align: center;

            font-size: 32px;
            font-weight: 500;
            letter-spacing: 3px;

            color: #1d2d44;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;

            font-size: 17px;
            font-weight: 600;

            color: #1f2d3d;
        }

        input[type="text"] {
            width: 100%;
            height: 58px;

            padding: 0 18px;

            border: 1px solid #d4dce6;
            border-radius: 7px;

            background: #ffffff;
            color: #34495e;

            font-size: 16px;

            outline: none;

            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: #8a99a8;
        }

        input[type="text"]:focus {
            border-color: #3978d8;

            box-shadow:
                0 0 0 3px rgba(57, 120, 216, 0.10);
        }

        input[type="submit"] {
            width: 100%;
            height: 64px;

            margin-top: 5px;

            border: none;
            border-radius: 7px;

            background: #3978d8;
            color: white;

            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        input[type="submit"]:hover {
            background: #2f69c2;

            transform: translateY(-1px);

            box-shadow:
                0 5px 14px rgba(57, 120, 216, 0.20);
        }

        .home-btn {
            display: block;

            width: 100%;
            height: 62px;

            margin-top: 18px;

            border: 2px solid #3978d8;
            border-radius: 7px;

            background: white;
            color: #3978d8;

            text-decoration: none;
            text-align: center;

            line-height: 58px;

            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;

            transition: all 0.2s ease;
        }

        .home-btn:hover {
            background: #3978d8;
            color: white;
        }

        @media (max-width: 700px) {

            .container {
                max-width: 92%;
                margin: 30px auto;
            }

            .card {
                padding: 35px 25px 35px 25px;
            }

            .card h1 {
                font-size: 27px;
                letter-spacing: 2px;
                margin-bottom: 30px;
            }

            input[type="text"] {
                height: 54px;
            }

            input[type="submit"] {
                height: 58px;
                font-size: 16px;
            }

            .home-btn {
                height: 58px;
                line-height: 54px;
                font-size: 16px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>SEARCH ASSIGNMENTS</h1>

            <form action="SearchAssignment" method="get">

                <div class="form-group">

                    <label for="subject">
                        Enter Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Example: Java"
                        required>

                </div>

                <input
                    type="submit"
                    value="SEARCH">

            </form>

            <a
                class="home-btn"
                href="Dashboard">

                BACK TO DASHBOARD

            </a>

        </div>

    </div>

</body>

</html>
