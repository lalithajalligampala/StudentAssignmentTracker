<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>


    <!-- =========================
         EMAILJS
         ========================= -->

    <script type="text/javascript"
            src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #eef6ff,
                #f4fbfa
            );

            color: #1f2d3d;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        body::before {
            content: '';

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: rgba(74, 144, 226, 0.06);

            top: -150px;
            left: -150px;

            z-index: -1;
        }

        body::after {
            content: '';

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(80, 190, 170, 0.06);

            bottom: -200px;
            right: -180px;

            z-index: -1;
        }

        .register-container {
            width: 100%;
            max-width: 520px;
        }

        .register-box {
            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #d4e3f5;

            border-radius: 14px;

            padding: 45px 45px 42px 45px;

            box-shadow:
                0 12px 35px rgba(31, 60, 90, 0.12),
                0 2px 8px rgba(31, 60, 90, 0.06);
        }


        /* =========================
           TITLE
           ========================= */

        .title {
            text-align: center;

            color: #1d2d44;

            font-size: 32px;

            font-weight: 500;

            letter-spacing: 3px;

            margin-bottom: 38px;

            text-transform: uppercase;
        }


        /* =========================
           INPUT GROUP
           ========================= */

        .input-group {
            display: flex;

            width: 100%;

            height: 58px;

            margin-bottom: 20px;
        }

        .input-icon {
            width: 58px;

            flex-shrink: 0;

            background-color: #f1f5fa;

            border: 1px solid #d4dce6;

            border-right: none;

            border-radius: 7px 0 0 7px;

            color: #3978d8;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 20px;
        }

        .input-group input {
            flex: 1;

            height: 58px;

            border: 1px solid #d4dce6;

            border-radius: 0 7px 7px 0;

            outline: none;

            background-color: #ffffff;

            padding: 0 18px;

            font-size: 16px;

            color: #34495e;

            transition: all 0.2s ease;
        }

        .input-group input::placeholder {
            color: #8a99a8;
        }

        .input-group input:focus {
            border-color: #3978d8;

            box-shadow:
                0 0 0 3px rgba(57, 120, 216, 0.10);
        }


        /* =========================
           REGISTER BUTTON
           ========================= */

        .register-btn {
            width: 100%;

            height: 64px;

            margin-top: 8px;

            border: none;

            border-radius: 7px;

            background-color: #3978d8;

            color: white;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .register-btn:hover {
            background-color: #2f69c2;

            transform: translateY(-1px);

            box-shadow:
                0 5px 14px rgba(57, 120, 216, 0.20);
        }

        .register-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           LOGIN BUTTON
           ========================= */

        .login-btn {
            display: block;

            width: 100%;

            height: 62px;

            line-height: 58px;

            margin-top: 18px;

            border: 2px solid #3978d8;

            border-radius: 7px;

            background-color: white;

            color: #3978d8;

            text-decoration: none;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;

            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background-color: #3978d8;

            color: white;
        }


        /* =========================
           MOBILE RESPONSIVE
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .register-box {
                padding: 35px 25px 32px 25px;
            }

            .title {
                font-size: 27px;

                letter-spacing: 2px;

                margin-bottom: 30px;
            }

            .input-group {
                height: 54px;
            }

            .input-icon {
                width: 54px;
            }

            .input-group input {
                height: 54px;
            }

            .register-btn {
                height: 58px;

                font-size: 16px;
            }

            .login-btn {
                height: 58px;

                line-height: 54px;

                font-size: 16px;
            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <!-- REGISTER BOX -->

    <div class="register-box">


        <!-- TITLE -->

        <div class="title">

            REGISTER

        </div>


        <!-- REGISTER FORM -->

        <form id="registerForm">


            <!-- NAME -->

            <div class="input-group">

                <div class="input-icon">
                    👤
                </div>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <div class="input-icon">
                    ✉️
                </div>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email ID"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <div class="input-icon">
                    🔒
                </div>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                id="registerButton"
                class="register-btn">

                REGISTER

            </button>


        </form>


        <!-- LOGIN BUTTON -->

        <a
            href="index.html"
            class="login-btn">

            LOGIN

        </a>


    </div>


</div>


<!-- =========================
     EMAILJS + REGISTRATION
     ========================= -->

<script>


    /*
     * Initialize EmailJS
     */

    emailjs.init({
        publicKey: "lW3GJrPPsL1pvSMwH"
    });


    /*
     * Registration Form
     */

    document.getElementById("registerForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            /* Get form values */

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            const button =
                document.getElementById("registerButton");


            /* Disable button */

            button.disabled = true;

            button.innerText = "REGISTERING...";


            try {


                /*
                 * Send registration data
                 * to RegisterServlet.
                 */

                const response = await fetch("RegisterServlet", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        "name=" + encodeURIComponent(name) +
                        "&email=" + encodeURIComponent(email) +
                        "&password=" + encodeURIComponent(password)

                });


                const result =
                    await response.text();


                /*
                 * Check servlet response.
                 */

                if (result.trim() === "SUCCESS") {


                    /*
                     * Send email through EmailJS.
                     */

                    await emailjs.send(

                        "service_0dd2o2j",

                        "template_6368n4j",

                        {
                            name: name,
                            email: email,
                            password: password
                        }

                    );


                    alert(
                        "Account created successfully!\n\n" +
                        "Your Name and Password have been sent to your email."
                    );


                    /*
                     * Go to login page.
                     */

                    window.location.href = "index.html";


                } else {


                    /*
                     * Registration failed.
                     */

                    alert(result);


                    button.disabled = false;

                    button.innerText = "REGISTER";

                }


            } catch (error) {


                console.error(
                    "Registration/EmailJS Error:",
                    error
                );


                alert(
                    "Account registration or email sending failed.\n\n" +
                    "Please try again."
                );


                button.disabled = false;

                button.innerText = "REGISTER";

            }

        });


</script>


</body>

</html>
