<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful - Student Assignment Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #1f2933;
        }

        /* Header */
        .header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 28px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 36px;
            font-weight: bold;
        }

        .header p {
            margin-top: 10px;
            font-size: 18px;
        }

        /* Main container */
        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* Success card */
        .success-card {
            background-color: white;
            padding: 45px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background-color: #27ae60;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
        }

        .success-card h2 {
            color: #2c3e50;
            font-size: 30px;
            margin-bottom: 20px;
        }

        .success-card p {
            font-size: 18px;
            margin: 12px 0;
            color: #333;
        }

        .welcome {
            font-size: 21px !important;
            font-weight: bold;
            color: #2c3e50 !important;
        }

        /* Button */
        .login-button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 35px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .login-button:hover {
            background-color: #2980b9;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .header h1 {
                font-size: 28px;
            }

            .header p {
                font-size: 16px;
            }

            .container {
                margin: 35px auto;
            }

            .success-card {
                padding: 30px 20px;
            }

            .success-card h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Student Assignment &amp; Deadline Tracker</h1>
        <p>Manage your assignments and keep track of important deadlines.</p>
    </header>

    <main class="container">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <h2>Registration Successful!</h2>

            <p class="welcome">
                Welcome, krishna!
            </p>

            <p>
                Your account has been created successfully.
            </p>

            <a href="login.html" class="login-button">
                Go to Login
            </a>

        </div>

    </main>

</body>
</html>
