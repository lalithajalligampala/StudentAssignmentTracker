<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>


    <!-- =========================
         EMAILJS
         ========================= -->

    <script type="text/javascript"
            src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #eef6ff,
                #f4fbfa
            );

            color: #1f2d3d;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }


        /* =========================
           BACKGROUND DECORATION
           ========================= */

        body::before {
            content: '';

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: rgba(74, 144, 226, 0.06);

            top: -150px;
            left: -150px;

            z-index: -1;
        }


        body::after {
            content: '';

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(80, 190, 170, 0.06);

            bottom: -200px;
            right: -180px;

            z-index: -1;
        }


        /* =========================
           MAIN CONTAINER
           ========================= */

        .register-container {
            width: 100%;
            max-width: 650px;
        }


        /* =========================
           REGISTER BOX
           ========================= */

        .register-box {
            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #d4e3f5;

            border-radius: 14px;

            padding: 45px 45px 42px 45px;

            box-shadow:
                0 12px 35px rgba(31, 60, 90, 0.12),
                0 2px 8px rgba(31, 60, 90, 0.06);
        }


        /* =========================
           TITLE
           ========================= */

        .title {
            text-align: center;

            color: #1d2d44;

            font-size: 32px;

            font-weight: 500;

            letter-spacing: 3px;

            margin-bottom: 38px;

            text-transform: uppercase;
        }


        /* =========================
           INPUT GROUP
           ========================= */

        .input-group {
            display: flex;

            width: 100%;

            height: 58px;

            margin-bottom: 20px;
        }


        .input-icon {
            width: 58px;

            flex-shrink: 0;

            background-color: #f1f5fa;

            border: 1px solid #d4dce6;

            border-right: none;

            border-radius: 7px 0 0 7px;

            color: #3978d8;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 20px;
        }


        .input-group input {
            flex: 1;

            height: 58px;

            border: 1px solid #d4dce6;

            border-radius: 0 7px 7px 0;

            outline: none;

            background-color: #ffffff;

            padding: 0 18px;

            font-size: 16px;

            color: #34495e;

            transition: all 0.2s ease;
        }


        .input-group input::placeholder {
            color: #8a99a8;
        }


        .input-group input:focus {
            border-color: #3978d8;

            box-shadow:
                0 0 0 3px rgba(57, 120, 216, 0.10);
        }


        /* =========================
           REGISTER BUTTON
           ========================= */

        .register-btn {
            width: 100%;

            height: 64px;

            margin-top: 8px;

            border: none;

            border-radius: 7px;

            background-color: #3978d8;

            color: white;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;

            cursor: pointer;

            transition: all 0.2s ease;
        }


        .register-btn:hover {
            background-color: #2f69c2;

            transform: translateY(-1px);

            box-shadow:
                0 5px 14px rgba(57, 120, 216, 0.20);
        }


        .register-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           LOGIN BUTTON
           ========================= */

        .login-btn {
            display: block;

            width: 100%;

            height: 62px;

            line-height: 58px;

            margin-top: 18px;

            border: 2px solid #3978d8;

            border-radius: 7px;

            background-color: white;

            color: #3978d8;

            text-decoration: none;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;

            transition: all 0.2s ease;
        }


        .login-btn:hover {
            background-color: #3978d8;

            color: white;
        }


        /* =========================
           SUCCESS SCREEN
           ========================= */

        .success-screen {
            display: none;

            text-align: center;
        }


        .success-screen.show {
            display: block;
        }


        /* =========================
           SUCCESS ICON
           ========================= */

        .success-icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 25px auto;

            border-radius: 50%;

            background-color: #eaf8ef;

            border: 3px solid #4caf72;

            color: #3b9d60;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 48px;

            font-weight: bold;
        }


        /* =========================
           SUCCESS TITLE
           ========================= */

        .success-title {
            color: #3978d8;

            font-size: 34px;

            font-weight: bold;

            margin-bottom: 28px;

            line-height: 1.2;
        }


        /* =========================
           SUCCESS MESSAGE CARD
           ========================= */

        .success-message-card {
            background-color: #eef5ff;

            border: 1px solid #d2e1f5;

            border-radius: 12px;

            padding: 28px 25px;

            margin-bottom: 30px;

            text-align: left;
        }


        .success-message-card p {
            margin: 0 0 15px 0;

            font-size: 18px;

            line-height: 1.6;

            color: #536579;
        }


        .success-message-card p:last-child {
            margin-bottom: 0;
        }


        .success-message-card strong {
            color: #1f2d3d;
        }


        /* =========================
           SUCCESS BUTTONS
           ========================= */

        .success-btn {
            display: block;

            width: 100%;

            min-height: 62px;

            padding: 15px 20px;

            margin-top: 15px;

            border-radius: 7px;

            text-decoration: none;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            transition: all 0.2s ease;
        }


        .success-login-btn {
            background-color: #3978d8;

            color: white;

            border: 2px solid #3978d8;

            box-shadow:
                0 5px 14px rgba(57, 120, 216, 0.18);
        }


        .success-login-btn:hover {
            background-color: #2f69c2;

            border-color: #2f69c2;

            transform: translateY(-1px);
        }


        .success-register-btn {
            background-color: white;

            color: #3978d8;

            border: 2px solid #3978d8;
        }


        .success-register-btn:hover {
            background-color: #3978d8;

            color: white;
        }


        /* =========================
           ERROR MESSAGE
           ========================= */

        .error-screen {
            display: none;

            margin-top: 20px;

            padding: 16px 18px;

            background-color: #fff0f0;

            border: 1px solid #efb0b0;

            border-radius: 8px;

            color: #a52828;

            font-size: 15px;

            line-height: 1.5;

            text-align: center;
        }


        .error-screen.show {
            display: block;
        }


        /* =========================
           MOBILE RESPONSIVE
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }


            .register-box {
                padding: 35px 25px 32px 25px;
            }


            .title {
                font-size: 27px;

                letter-spacing: 2px;

                margin-bottom: 30px;
            }


            .input-group {
                height: 54px;
            }


            .input-icon {
                width: 54px;
            }


            .input-group input {
                height: 54px;
            }


            .register-btn {
                height: 58px;

                font-size: 16px;
            }


            .login-btn {
                height: 58px;

                line-height: 54px;

                font-size: 16px;
            }


            .success-icon {
                width: 75px;
                height: 75px;

                font-size: 38px;

                margin-bottom: 20px;
            }


            .success-title {
                font-size: 28px;

                margin-bottom: 22px;
            }


            .success-message-card {
                padding: 22px 18px;
            }


            .success-message-card p {
                font-size: 16px;
            }


            .success-btn {
                font-size: 16px;

                min-height: 58px;
            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <!-- =========================
         REGISTER BOX
         ========================= -->

    <div class="register-box">


        <!-- =========================
             REGISTER SECTION
             ========================= -->

        <div id="registerSection">


            <!-- TITLE -->

            <div class="title">

                REGISTER

            </div>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="input-group">

                    <div class="input-icon">
                        👤
                    </div>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <div class="input-icon">
                        ✉️
                    </div>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email ID"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <div class="input-icon">
                        🔒
                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required>

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    id="registerButton"
                    class="register-btn">

                    REGISTER

                </button>


            </form>


            <!-- LOGIN BUTTON -->

            <a
                href="index.html"
                class="login-btn">

                LOGIN

            </a>


            <!-- ERROR MESSAGE -->

            <div
                id="errorScreen"
                class="error-screen">
            </div>


        </div>


        <!-- =========================
             SUCCESS SECTION
             ========================= -->

        <div
            id="successScreen"
            class="success-screen">


            <!-- SUCCESS ICON -->

            <div class="success-icon">

                ✓

            </div>


            <!-- SUCCESS TITLE -->

            <div class="success-title">

                Account Created Successfully!

            </div>


            <!-- SUCCESS MESSAGE -->

            <div class="success-message-card">

                <p>
                    Your account has been created successfully.
                </p>

                <p>
                    Your <strong>Name and Password</strong>
                    have been sent to your email.
                </p>

                <p>
                    You can now use your account to log in
                    to the Student Assignment & Deadline Tracker.
                </p>

            </div>


            <!-- LOGIN BUTTON -->

            <a
                href="index.html"
                class="success-btn success-login-btn">

                LOGIN

            </a>


            <!-- REGISTER ANOTHER ACCOUNT -->

            <button
                type="button"
                class="success-btn success-register-btn"
                onclick="registerAnotherAccount()">

                REGISTER ANOTHER ACCOUNT

            </button>


        </div>


    </div>


</div>


<!-- =========================
     EMAILJS + REGISTRATION
     ========================= -->

<script>


    /*
     * Initialize EmailJS
     */

    emailjs.init({

        publicKey: "lW3GJrPPsL1pvSMwH"

    });


    /*
     * Get elements
     */

    const registerForm =
        document.getElementById("registerForm");

    const registerButton =
        document.getElementById("registerButton");

    const registerSection =
        document.getElementById("registerSection");

    const successScreen =
        document.getElementById("successScreen");

    const errorScreen =
        document.getElementById("errorScreen");


    /*
     * Show error message
     */

    function showError(message) {

        errorScreen.innerHTML = "✕ " + message;

        errorScreen.classList.add("show");

    }


    /*
     * Hide error message
     */

    function hideError() {

        errorScreen.innerHTML = "";

        errorScreen.classList.remove("show");

    }


    /*
     * Show success screen
     */

    function showSuccessScreen() {

        registerSection.style.display = "none";

        successScreen.classList.add("show");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /*
     * Register another account
     */

    function registerAnotherAccount() {

        window.location.reload();

    }


    /*
     * Registration Form
     */

    registerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /*
             * Hide previous error
             */

            hideError();


            /*
             * Get form values
             */

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            /*
             * Disable button
             */

            registerButton.disabled = true;

            registerButton.innerText =
                "REGISTERING...";


            try {


                /*
                 * Send registration data
                 * to RegisterServlet
                 */

                const response =
                    await fetch(
                        "RegisterServlet",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/x-www-form-urlencoded"

                            },

                            body:
                                "name=" +
                                encodeURIComponent(name) +

                                "&email=" +
                                encodeURIComponent(email) +

                                "&password=" +
                                encodeURIComponent(password)

                        }
                    );


                /*
                 * Get servlet response
                 */

                const result =
                    await response.text();


                /*
                 * Check servlet response
                 */

                if (result.trim() === "SUCCESS") {


                    /*
                     * Send email through EmailJS
                     */

                    await emailjs.send(

                        "service_0dd2o2j",

                        "template_6368n4j",

                        {

                            name: name,

                            email: email,

                            password: password

                        }

                    );


                    /*
                     * Email successfully sent.
                     *
                     * Now show the full
                     * success screen.
                     */

                    showSuccessScreen();


                } else {


                    /*
                     * Registration failed.
                     */

                    showError(result);


                    registerButton.disabled =
                        false;

                    registerButton.innerText =
                        "REGISTER";

                }


            } catch (error) {


                /*
                 * Print error in browser console
                 */

                console.error(
                    "Registration/EmailJS Error:",
                    error
                );


                /*
                 * Show error message
                 */

                showError(
                    "Account registration or email sending failed. " +
                    "Please try again."
                );


                /*
                 * Enable button again
                 */

                registerButton.disabled =
                    false;

                registerButton.innerText =
                    "REGISTER";

            }

        }
    );

</script>


</body>

</html>
